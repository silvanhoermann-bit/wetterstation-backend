<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetterstation Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f5f3;
      --surface:   #ffffff;
      --border:    rgba(0,0,0,0.10);
      --text:      #1a1a18;
      --muted:     #6b6b67;
      --radius:    12px;
      --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #1a1a18;
        --surface: #242422;
        --border:  rgba(255,255,255,0.10);
        --text:    #f0ede8;
        --muted:   #9a9a96;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 500; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #1D9E75;
      animation: pulse 2s infinite;
    }
    .dot.offline { background: #E24B4A; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .card-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-value {
      font-size: 34px;
      font-weight: 500;
      line-height: 1;
      color: var(--text);
    }
    .card-unit { font-size: 16px; color: var(--muted); margin-left: 2px; }
    .card-sub  { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .chart-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 12px;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .chart-title { font-size: 13px; font-weight: 500; }
    .pills { display: flex; gap: 4px; }
    .pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .pill.active {
      background: var(--bg);
      color: var(--text);
      border-color: rgba(0,0,0,0.2);
    }
    canvas { display: block; }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 8px 12px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 0.5px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .badge-ok   { background: #E1F5EE; color: #0F6E56; }
    .badge-warn { background: #FAEEDA; color: #854F0B; }

    @media (prefers-color-scheme: dark) {
      .badge-ok   { background: #085041; color: #9FE1CB; }
      .badge-warn { background: #633806; color: #FAC775; }
    }

    .refresh-btn {
      background: none;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover { background: var(--bg); }

    .error-box {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1><i class="ti ti-cloud" style="font-size:20px;vertical-align:-2px;margin-right:6px" aria-hidden="true"></i>Wetterstation</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="refresh-btn" onclick="loadAll()">
        <i class="ti ti-refresh" style="font-size:14px" aria-hidden="true"></i> Aktualisieren
      </button>
      <div class="status">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Verbinde...</span>
      </div>
    </div>
  </header>

  <!-- Aktuelle Werte -->
  <div class="grid-3" id="metric-cards">
    <div class="card">
      <div class="card-label"><i class="ti ti-temperature" style="font-size:15px;color:#E24B4A" aria-hidden="true"></i> Temperatur</div>
      <div class="card-value">–<span class="card-unit">°C</span></div>
      <div class="card-sub">Lade...</div>
    </div>
    <div class="card">
      <div class="card-label"><i class="ti ti-gauge" style="font-size:15px;color:#378ADD" aria-hidden="true"></i> Luftdruck</div>
      <div class="card-value">–<span class="card-unit">hPa</span></div>
      <div class="card-sub">Lade...</div>
    </div>
    <div class="card">
      <div class="card-label"><i class="ti ti-droplet" style="font-size:15px;color:#1D9E75" aria-hidden="true"></i> Luftfeuchtigkeit</div>
      <div class="card-value">–<span class="card-unit">%</span></div>
      <div class="card-sub">Lade...</div>
    </div>
  </div>

  <!-- Temperaturverlauf -->
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Temperaturverlauf</span>
      <div class="pills">
        <button class="pill active" onclick="setPeriod(this,1)">1h</button>
        <button class="pill" onclick="setPeriod(this,6)">6h</button>
        <button class="pill" onclick="setPeriod(this,24)">24h</button>
        <button class="pill" onclick="setPeriod(this,168)">7 Tage</button>
      </div>
    </div>
    <div style="position:relative;height:200px;">
      <canvas id="tempChart" role="img" aria-label="Temperaturverlauf">Temperaturverlauf wird geladen.</canvas>
    </div>
  </div>

  <!-- Luftdruck & Feuchtigkeit -->
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Luftdruck & Luftfeuchtigkeit</span>
    </div>
    <div style="position:relative;height:180px;">
      <canvas id="comboChart" role="img" aria-label="Verlauf Luftdruck und Luftfeuchtigkeit">Verlauf wird geladen.</canvas>
    </div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#378ADD;"></span>Luftdruck</span>
      <span><span class="legend-dot" style="background:#1D9E75;"></span>Luftfeuchtigkeit</span>
    </div>
  </div>

  <!-- Letzte Messungen -->
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Letzte Messungen</span>
    </div>
    <div id="table-wrap">
      <div class="error-box">Lade Daten...</div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const API = '';   // leer = gleicher Server; für externes Hosting z.B. "https://deine-domain.de"
  let currentHours = 1;
  let tempChart, comboChart;
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  const tickColor = isDark ? '#9a9a96' : '#6b6b67';

  function fmt(dt) {
    const d = new Date(dt);
    return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtFull(dt) {
    const d = new Date(dt);
    return d.toLocaleString('de-DE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  async function fetchJSON(url) {
    const r = await fetch(API + url);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  function setStatus(online, text) {
    document.getElementById('status-dot').className = 'dot' + (online ? '' : ' offline');
    document.getElementById('status-text').textContent = text;
  }

  function updateMetricCards(row) {
    const cards = document.querySelectorAll('#metric-cards .card');
    const ts = fmtFull(row.timestamp);

    [[row.temperature, '°C', 'Temperatur', ts],
     [row.pressure,    'hPa','Luftdruck',  ts],
     [row.humidity,    '%',  'Feuchtigkeit', ts]
    ].forEach(([val, unit, , time], i) => {
      cards[i].querySelector('.card-value').innerHTML =
        parseFloat(val).toFixed(1) + `<span class="card-unit">${unit}</span>`;
      cards[i].querySelector('.card-sub').textContent = 'Stand: ' + time;
    });
  }

  function initTempChart(labels, data) {
    if (tempChart) tempChart.destroy();
    tempChart = new Chart(document.getElementById('tempChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Temperatur (°C)',
          data,
          borderColor: '#E24B4A',
          backgroundColor: 'rgba(226,75,74,0.07)',
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointRadius: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: tickColor, maxTicksLimit: 8, font: { size: 11 } } },
          y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 }, callback: v => v.toFixed(1) + '°C' } }
        }
      }
    });
  }

  function initComboChart(labels, presData, humData) {
    if (comboChart) comboChart.destroy();
    comboChart = new Chart(document.getElementById('comboChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Luftdruck (hPa)',
            data: presData,
            borderColor: '#378ADD',
            borderWidth: 2,
            fill: false,
            tension: 0.4,
            pointRadius: 2,
            borderDash: [5, 3],
            yAxisID: 'yP',
          },
          {
            label: 'Feuchtigkeit (%)',
            data: humData,
            borderColor: '#1D9E75',
            backgroundColor: 'rgba(29,158,117,0.07)',
            borderWidth: 2,
            fill: true,
            tension: 0.4,
            pointRadius: 2,
            yAxisID: 'yH',
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x:  { grid: { color: gridColor }, ticks: { color: tickColor, maxTicksLimit: 8, font: { size: 11 } } },
          yP: { position: 'left',  grid: { color: gridColor }, ticks: { color: '#378ADD', font: { size: 11 }, callback: v => v.toFixed(0) + ' hPa' } },
          yH: { position: 'right', grid: { display: false },   ticks: { color: '#1D9E75', font: { size: 11 }, callback: v => v.toFixed(0) + '%' } }
        }
      }
    });
  }

  function updateTable(rows) {
    if (!rows.length) {
      document.getElementById('table-wrap').innerHTML = '<div class="error-box">Noch keine Messungen vorhanden.</div>';
      return;
    }
    const html = `
      <table>
        <thead>
          <tr>
            <th>Zeitpunkt</th>
            <th>Temperatur</th>
            <th>Luftdruck</th>
            <th>Feuchtigkeit</th>
            <th>Station</th>
          </tr>
        </thead>
        <tbody>
          ${rows.slice(0, 20).map(r => `
            <tr>
              <td>${fmtFull(r.timestamp)}</td>
              <td>${parseFloat(r.temperature).toFixed(1)} °C</td>
              <td>${parseFloat(r.pressure).toFixed(1)} hPa</td>
              <td>${parseFloat(r.humidity).toFixed(1)} %</td>
              <td><span class="badge badge-ok">${r.station_id}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
    document.getElementById('table-wrap').innerHTML = html;
  }

  async function loadCharts(hours) {
    const limit = hours <= 6 ? 200 : 500;
    const rows = await fetchJSON(`/api/data?hours=${hours}&limit=${limit}`);
    const sorted = rows.slice().reverse();
    const labels   = sorted.map(r => fmt(r.timestamp));
    const temps    = sorted.map(r => parseFloat(r.temperature));
    const pressures = sorted.map(r => parseFloat(r.pressure));
    const humids   = sorted.map(r => parseFloat(r.humidity));
    initTempChart(labels, temps);
    initComboChart(labels, pressures, humids);
  }

  async function loadAll() {
    try {
      const [latest, recent] = await Promise.all([
        fetchJSON('/api/latest'),
        fetchJSON('/api/data?limit=20')
      ]);

      if (latest.length) {
        updateMetricCards(latest[0]);
        setStatus(true, 'Verbunden · ' + fmtFull(latest[0].timestamp));
      }

      updateTable(recent);
      await loadCharts(currentHours);

    } catch(e) {
      setStatus(false, 'Keine Verbindung zum Server');
      document.getElementById('table-wrap').innerHTML =
        '<div class="error-box"><i class="ti ti-wifi-off" style="font-size:24px;display:block;margin-bottom:8px" aria-hidden="true"></i>Server nicht erreichbar.<br>Stelle sicher dass server.js läuft.</div>';
    }
  }

  function setPeriod(btn, hours) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentHours = hours;
    loadCharts(hours);
  }

  // Beim Start laden, dann alle 60 Sekunden automatisch aktualisieren
  loadAll();
  setInterval(loadAll, 60000);
</script>
</body>
</html>
